<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KS ❤️ XY</title>
  <style>
    body {
      margin: 0; padding: 2rem 1rem;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #5a1a01;
      text-align: center;
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center;
    }
    h1 {
      font-size: 3rem; margin-bottom: 0.5rem;
    }
    .heart {
      color: #d81e5b;
      display: inline-block;
      margin: 0 0.3em;
    }
    p {
      font-size: 1.2rem; margin: 0.6rem 0;
      max-width: 600px; margin-left: auto; margin-right: auto;
      line-height: 1.5;
    }
    footer {
      margin-top: 2rem; font-size: 0.9rem; color: #a35a4d99;
    }
  </style>
</head>
<body>
  <h1>KS <span class="heart">❤️</span> XY</h1>
  <p>你像一个天使，走进我的人生。</p>
  <p>让我看到生活的美好。</p>
  <footer>© <span id="year"></span> KS & XY</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
